name: WacomTablet
options:
  bundleIdPrefix: com.wacomopensource
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  CLANG_CXX_LANGUAGE_STANDARD: c++20

targets:
  WacomTabletApp:
    type: application
    platform: macOS
    sources:
      - WacomTabletApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wacomopensource.tablet
      INFOPLIST_FILE: WacomTabletApp/Info.plist
      CODE_SIGN_ENTITLEMENTS: WacomTabletApp/WacomTabletApp.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: V29E8BPY35
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: false
      ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: WacomTabletDriver
        embed: true
        codeSign: true

  WacomTabletDriver:
    type: system-extension
    platform: macOS
    sources:
      - WacomTabletDriver
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wacomopensource.tablet.driver
      INFOPLIST_FILE: WacomTabletDriver/Info.plist
      CODE_SIGN_ENTITLEMENTS: WacomTabletDriver/WacomTabletDriver.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: V29E8BPY35
      SDKROOT: driverkit
      DRIVERKIT_DEPLOYMENT_TARGET: "21.0"
      GENERATE_INFOPLIST_FILE: false
      SYSTEM_FRAMEWORK_SEARCH_PATHS:
        - $(SDKROOT)/System/DriverKit/System/Library/Frameworks
      SYSTEM_HEADER_SEARCH_PATHS:
        - $(SDKROOT)/System/DriverKit/usr/include
        - $(SDKROOT)/System/DriverKit/System/Library/Frameworks/HIDDriverKit.framework/Headers
        - $(SDKROOT)/System/DriverKit/System/Library/Frameworks/DriverKit.framework/Headers
      OTHER_LDFLAGS:
        - -framework HIDDriverKit
        - -framework DriverKit
